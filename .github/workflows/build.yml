name: build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  SDK_VERSION: "25.12.2"
  TARGET: "ramips"
  SUBTARGET: "mt7621"
  GCC: "14.3.0"
  PACKAGE_DIR: "luci-app-menuMove"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install zstd
        run: sudo apt-get update && sudo apt-get install -y zstd

      - name: Cache SDK tarball
        uses: actions/cache@v4
        with:
          path: sdk.tar.zst
          key: sdk-${{ env.SDK_VERSION }}-${{ env.TARGET }}-${{ env.SUBTARGET }}

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: |
            ~/.ccache
            immortalwrt-sdk-*/.ccache
          key: ccache-${{ env.SDK_VERSION }}-${{ env.TARGET }}-${{ env.SUBTARGET }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ env.SDK_VERSION }}-${{ env.TARGET }}-${{ env.SUBTARGET }}-

            - name: Download ImmortalWrt SDK
        run: |
          test -s sdk.tar.zst || wget -q -O sdk.tar.zst \
            "https://downloads.immortalwrt.org/releases/${SDK_VERSION}/targets/${TARGET}/${SUBTARGET}/immortalwrt-sdk-${SDK_VERSION}-${TARGET}-${SUBTARGET}_gcc-${GCC}_musl.Linux-x86_64.tar.zst"
          tar --zstd -xf sdk.tar.zst

      - name: Copy package into SDK
        run: |
          cp -r "${PACKAGE_DIR}" immortalwrt-sdk-*/package/
          ls -d immortalwrt-sdk-*/package/${PACKAGE_DIR}

      - name: Update feeds
        run: |
          cd immortalwrt-sdk-*/
          ./scripts/feeds update -a
          ./scripts/feeds install -a -f
          make defconfig

      - name: Enable Simplified Chinese translation
        run: |
          cd immortalwrt-sdk-*/
          sed -i 's/^# CONFIG_LUCI_LANG_zh_Hans is not set/CONFIG_LUCI_LANG_zh_Hans=y/' .config
          grep -q '^CONFIG_LUCI_LANG_zh_Hans=y' .config || echo 'CONFIG_LUCI_LANG_zh_Hans=y' >> .config
          echo 'CONFIG_CCACHE=y' >> .config
          make defconfig

      - name: Sanity checks
        run: |
          python3 "${PACKAGE_DIR}/test/check.py"

      - name: Build
        run: |
          cd immortalwrt-sdk-*/
          make package/${PACKAGE_DIR}/compile -j$(nproc)

      - name: Show built packages and their contents
        if: always()
        run: |
          find immortalwrt-sdk-*/bin/packages -name '*.apk' -o -name '*.ipk' | sort || true
          python3 "${PACKAGE_DIR}/test/apk_info.py" "immortalwrt-sdk-*/bin/packages/**/luci*.apk" || true

      # 硬门槛：包里的关键文件必须真的存在、且装在预期路径上
      # （曾经出现过「模块没进包」，光看编译成功是发现不了的）
      - name: Verify package contents
        run: |
          python3 "${PACKAGE_DIR}/test/apk_info.py" \
            --expect /usr/bin/menu-move \
            --expect /etc/init.d/menu-move \
            --expect /etc/config/menu-move \
            --expect /etc/uci-defaults/90-luci-app-menuMove \
            --expect /usr/share/ucode/luci/menuMove.uc \
            --expect /usr/share/rpcd/ucode/luci.menuMove \
            --expect /usr/share/rpcd/acl.d/luci-app-menuMove.json \
            --expect /usr/share/luci/menu.d/luci-app-menuMove.json \
            --expect /www/luci-static/resources/view/menuMove/overview.js \
            "immortalwrt-sdk-*/bin/packages/**/luci-app-menuMove*.apk"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-menuMove
          if-no-files-found: warn
          path: |
            immortalwrt-sdk-*/bin/packages/**/luci-app-menuMove*.apk
            immortalwrt-sdk-*/bin/packages/**/luci-i18n-menuMove*.apk
            immortalwrt-sdk-*/bin/packages/**/luci-app-menuMove*.ipk
            immortalwrt-sdk-*/bin/packages/**/luci-i18n-menuMove*.ipk
